services:
  db:
    image: postgres:15-bookworm
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scolvpet}
      POSTGRES_USER: ${POSTGRES_USER:-scolvpet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - scolvpet_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scolvpet} -d ${POSTGRES_DB:-scolvpet}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scolvpet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scolvpet}?sslmode=disable
      API_ADDR: :8080
      IMPORT_OBJECT_STORE_DIR: /var/lib/scolvpet/objects
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - scolvpet_objects:/var/lib/scolvpet/objects
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.web
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      WEB_PORT: ${WEB_PORT:-3000}
      # Root host only — web URL builder appends /v1 itself (avoid /v1/v1).
      WEB_API_BASE_URL: ${WEB_API_BASE_URL:-http://api:8080}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000'"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  scolvpet_postgres:
  scolvpet_objects:
