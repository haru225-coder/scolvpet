name: scolvpet-i1

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: '3.44.0'
  DART_VERSION: '3.12.0'
  GO_VERSION: '1.26.x'
  NODE_VERSION: '22.x'
  IOS_SIMULATOR_RUNTIME: 'iOS 26.5'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: OpenAPI lint
        run: make openapi-lint
      - name: OpenAPI ↔ server route conformance
        run: make openapi-conformance
      - name: Migration source drift
        run: make migration-drift
      - name: Generated dart-dio client drift
        run: make client-drift
      - name: Mini-program contract tests
        run: make miniprogram-test
      - name: Web lint
        run: make web-lint
      - name: Flutter dependencies
        run: make flutter-pub-get
      - name: Flutter analyze
        run: make flutter-analyze
      - name: App version constant matches pubspec
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*//p' apps/mobile/pubspec.yaml | head -1 | tr -d '\r')"
          CONST_VERSION="$(sed -n "s/.*defaultValue: '\\([^']*\\)'.*/\\1/p" apps/mobile/lib/core/app_version.dart | head -1)"
          test "$PUBSPEC_VERSION" = "$CONST_VERSION"
          echo "app version ok: $PUBSPEC_VERSION"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15.17
        env:
          POSTGRES_USER: scolvpet
          POSTGRES_PASSWORD: scolvpet
          POSTGRES_DB: scolvpet
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U scolvpet -d scolvpet"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Flutter dependencies
        run: make flutter-pub-get
      - name: Database migrations and seed
        env:
          DATABASE_URL: postgres://scolvpet:scolvpet@127.0.0.1:55432/scolvpet?sslmode=disable
        run: DATABASE_URL="$DATABASE_URL" db/scripts/migrate.sh --seed
      - name: API unit tests
        env:
          # Required so store public-idempotency concurrency tests do not silent-SKIP.
          DATABASE_URL: postgres://scolvpet:scolvpet@127.0.0.1:55432/scolvpet?sslmode=disable
          AUTH_TEST_DATABASE_URL: postgres://scolvpet:scolvpet@127.0.0.1:55432/scolvpet?sslmode=disable
        run: make api-test
      - name: API I1 smoke and integration checks
        env:
          DATABASE_URL: postgres://scolvpet:scolvpet@127.0.0.1:55432/scolvpet?sslmode=disable
        run: make smoke
      - name: Public reservation smoke
        env:
          DATABASE_URL: postgres://scolvpet:scolvpet@127.0.0.1:55432/scolvpet?sslmode=disable
        run: make reservation-smoke
      - name: Media smoke
        env:
          DATABASE_URL: postgres://scolvpet:scolvpet@127.0.0.1:55432/scolvpet?sslmode=disable
        run: make media-smoke
      - name: Object store smoke
        env:
          DATABASE_URL: postgres://scolvpet:scolvpet@127.0.0.1:55432/scolvpet?sslmode=disable
        run: make objectstore-smoke
      - name: Outbox claim and retry checks
        env:
          DATABASE_URL: postgres://scolvpet:scolvpet@127.0.0.1:55432/scolvpet?sslmode=disable
        run: make outbox-test
      - name: Timeout wrapper check
        run: make timeout-test
      - name: Web tests
        run: make web-test
      - name: Flutter tests
        run: make flutter-test

  build-android:
    name: build / Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Flutter dependencies
        run: make flutter-pub-get
      - name: Android debug build
        run: make flutter-build-android
      - name: Upload reproducible debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scolvpet-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-web:
    name: build / Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Web build
        run: make web-build

  build-ios-simulator:
    name: build / iOS simulator (iOS 26.5)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Flutter dependencies
        run: make flutter-pub-get
      - name: Diagnose required iOS simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "Required simulator runtime: ${IOS_SIMULATOR_RUNTIME}"
          xcodebuild -version
          echo '--- installed runtimes ---'
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -Fq "${IOS_SIMULATOR_RUNTIME}"; then
            echo "::error title=Missing iOS simulator runtime::${IOS_SIMULATOR_RUNTIME} is required for the simulator build."
            echo '--- available devices ---'
            xcrun simctl list devices available || true
            exit 1
          fi
      - name: iOS simulator build
        working-directory: apps/mobile
        run: flutter build ios --simulator --no-codesign --no-pub
