  /data-center/import-jobs/{job_id}/preflight:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [导入]
      operationId: preflightImportJob
      summary: 全量预检 CSV
      description: |
        全量检查缺列、重复编号、父母缺失、父母与既有窝次不一致、谱系环、笼位冲突
        和非法体重。仓鼠模板可按窝次编号自动规划历史窝次，但只有同一窝次的出生时间、
        双亲和物种规则全部一致时才允许创建；任何冲突均作为阻塞问题返回，不静默合并。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPreflightRequest'
      responses:
        '202':
          description: 预检任务已排队
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /data-center/import-jobs/{job_id}/commit:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [导入]
      operationId: commitImportJob
      summary: 提交正式导入
      description: |
        使用幂等批次号正式写入；提交前重新校验 preflight_version、全部阻塞问题和逐项
        更新确认。历史窝次先按预检计划原子创建，再建立成员与父母关系；部分失败时保留
        逐行结果，但不允许产生缺父母、错窝次或悬空谱系引用。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCommitRequest'
      responses:
        '202':
          description: 正式导入已排队
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

