      properties:
        preflight_version:
          type: integer
          minimum: 1
        batch_key:
          type: string
          minLength: 8
          maxLength: 128
        partial_failure_policy:
          type: string
          enum: [continue_and_report, rollback_all]
        approved_updates:
          type: array
          uniqueItems: true
          items:
            type: object
            required: [row_number, resource_id, expected_version, fields]
            properties:
              row_number:
                type: integer
                minimum: 1
              resource_id:
                type: string
                format: uuid
              expected_version:
                type: integer
                minimum: 1
              fields:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
            additionalProperties: false
          description: 预检列出的更新候选逐项确认；未列出的已有非空字段保持不变
      additionalProperties: false

