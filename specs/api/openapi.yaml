openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 熊舍管家 MVP API
  version: 1.0.1
  summary: 熊舍管家 MVP 的 REST API 契约
  description: |
    面向 Flutter 客户端的模块化单体 REST API 草案。

    所有租户业务数据都由 Bearer 令牌中的认证上下文确定 owner_id；
    普通写请求体不接收 owner_id。状态迁移统一通过动作接口完成，
    客户端不得直接 PATCH state。

    除公开分享读取外，所有资源 ID 都先在认证 owner_id 范围内解析；
    不存在与跨 owner 资源统一返回 404，错误体不暴露其他账号的业务字段。

    写请求统一支持 Idempotency-Key。可并发编辑的资源通过 If-Match
    传入当前版本，响应同时返回 ETag 与资源 version。所有 date-time
    均以 UTC 传输，业务日期计算使用请求或当前熊舍的 IANA timezone。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.scolvpet.cn/v1
    description: 生产环境
  - url: https://api-staging.scolvpet.cn/v1
    description: 预发布环境
tags:
  - name: 认证
    description: 手机验证码与会话
  - name: 账号
    description: 当前账号和当前熊舍
  - name: 物种规则
    description: 系统模板、舍主副本与历史规则版本
  - name: 仓鼠
    description: 仓鼠个体档案与批量建档
  - name: 家谱
    description: 家谱图、父母关系、窝次父母与窝次成员
  - name: 笼舍
    description: 笼盒和入住、移笼历史
  - name: 繁育
    description: 繁育计划、配对尝试、观察与状态动作
  - name: 窝次
    description: 窝次、临时幼崽、数量、断奶、分性分笼与个体化
  - name: 体重健康
    description: 克级体重和健康记录
  - name: 任务提醒
    description: 业务任务、逐项完成和提醒投递
  - name: 媒体
    description: 预签名上传、编辑派生、转码和封面
  - name: 分享
    description: 可撤销公开分享与无需认证的公开读取
  - name: 导入
    description: CSV 模板、上传、映射、预检、提交和逐行结果
  - name: 导出备份
    description: 异步导出、备份、下载和失败重试
  - name: 数据中心
    description: 数据中心摘要
  - name: 作业
    description: 通用异步作业状态
  - name: 用量
    description: 当前用量与历史快照
  - name: P1 成员
    description: 熊舍成员邀请、角色和撤销
  - name: P1 CRM
    description: 客户、预订和交付
  - name: P1 合同与回执
    description: 合同与回执模板、单据和签发
  - name: P1 记账
    description: 分类、流水与汇总
  - name: P1 遗传
    description: 遗传位点、档案和配对模拟
  - name: P1 推送
    description: 设备令牌与推送审计
  - name: P1 权益
    description: 套餐、用量门限和沙箱激活
  - name: P2 官网
    description: 公开主页配置、发布和匿名投影
  - name: P2 小程序
    description: 小程序配置与沙箱审核流水
  - name: P2 助手
    description: 只读数据助手
  - name: P2 借配
    description: 种公挂牌与跨舍借配履约
security:
  - bearerAuth: []
paths:
  /auth/verification-codes:
    post:
      tags: [认证]
      operationId: sendVerificationCode
      summary: 发送手机验证码
      description: 为登录目的发送验证码；相同手机号和用途受冷却时间与频率限制。
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestTimezone'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendVerificationCodeRequest'
            example:
              phone: '+8613800138000'
              purpose: login
      responses:
        '202':
          description: 验证码已受理发送
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCodeChallengeResponse'
              example:
                data:
                  verification_id: 018f47a2-2f7e-7f5d-a413-5bfe09a61f62
                  expires_in_seconds: 300
                  retry_after_seconds: 60
                meta:
                  request_id: req_01J0AUTH001
                  generated_at: '2026-07-16T01:00:00Z'
                  timezone: Asia/Shanghai
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/sessions:
    post:
      tags: [认证]
      operationId: createSession
      summary: 使用手机验证码登录
      description: 校验验证码并返回 Bearer 访问令牌、刷新令牌和当前个人熊舍。
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestTimezone'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeLoginRequest'
            example:
              phone: '+8613800138000'
              verification_id: 018f47a2-2f7e-7f5d-a413-5bfe09a61f62
              code: '482931'
              device:
                platform: ios
                device_name: iPhone
                app_version: 0.1.0
      responses:
        '201':
          description: 登录成功
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                data:
                  token_type: Bearer
                  access_token: eyJhbGciOiJFUzI1NiJ9.example
                  expires_in_seconds: 3600
                  refresh_token: rt_01J0AUTH002
                  account:
                    id: 018f47a2-31dc-7e1d-9f69-3b77e4c55d11
                    phone_masked: 138****8000
                    display_name: 林舍主
                  current_organization:
                    id: 018f47a2-3358-7e83-852e-4ac411980d60
                    owner_id: 018f47a2-31dc-7e1d-9f69-3b77e4c55d11
                    name: 星河熊舍
                    mode: personal
                    timezone: Asia/Shanghai
                    weight_unit: g
                    version: 1
                    created_at: '2026-07-16T01:00:00Z'
                    updated_at: '2026-07-16T01:00:00Z'
                  member_role: owner
                  capabilities:
                    - member_role:owner
                    - tenant_scope
                    - offline_read_cache
                    - manage_members
                    - write_breeding
                    - write_litter
                    - write_hamster
                    - write_enclosure
                    - write_weight
                    - write_task
                    - write_health
                    - write_import
                    - write_media
                    - write_crm
                    - write_documents
                    - write_accounting
                    - write_growth
                meta:
                  request_id: req_01J0AUTH002
                  generated_at: '2026-07-16T01:00:00Z'
                  timezone: Asia/Shanghai
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/sessions/refresh:
    post:
      tags: [认证]
      operationId: refreshSession
      summary: 刷新当前会话
      description: 使用刷新令牌轮换访问令牌和刷新令牌，供客户端恢复认证 owner 上下文。
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestTimezone'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
      responses:
        '201':
          description: 会话刷新成功
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/sessions/current:
    delete:
      tags: [认证]
      operationId: deleteCurrentSession
      summary: 退出当前会话
      description: 使当前访问令牌与对应刷新令牌失效。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 会话已失效
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [账号]
      operationId: getCurrentAccount
      summary: 获取当前账号
      description: 返回认证账号、当前熊舍和会话能力。
      responses:
        '200':
          description: 当前账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /organizations/current:
    get:
      tags: [账号]
      operationId: getCurrentOrganization
      summary: 获取当前熊舍
      description: 当前熊舍由认证上下文选择。
      responses:
        '200':
          description: 当前熊舍
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [账号]
      operationId: updateCurrentOrganization
      summary: 更新当前熊舍
      description: 仅更新熊舍资料；owner_id 由认证上下文解析且不在请求体中出现。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateRequest'
            example:
              name: 星河熊舍二号馆
              timezone: Asia/Shanghai
      responses:
        '200':
          description: 熊舍已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /species-rule-templates:
    get:
      tags: [物种规则]
      operationId: listSpeciesRuleTemplates
      summary: 列出系统物种规则模板
      description: 返回系统维护的只读模板，可复制为当前熊舍规则版本。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 物种规则模板列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesRuleVersionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /species-rule-versions:
    get:
      tags: [物种规则]
      operationId: listSpeciesRuleVersions
      summary: 列出当前熊舍规则版本
      description: 按 cursor 分页返回当前熊舍复制或创建的历史规则版本。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: species_code
          in: query
          required: false
          schema:
            type: string
          description: 按物种编码筛选
      responses:
        '200':
          description: 规则版本列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesRuleVersionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [物种规则]
      operationId: createSpeciesRuleVersion
      summary: 创建规则版本
      description: 可从系统模板复制并调整；历史繁育计划继续引用其原规则快照。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesRuleVersionCreateRequest'
      responses:
        '201':
          description: 规则版本已创建
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesRuleVersionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /species-rule-versions/{rule_version_id}:
    parameters:
      - $ref: '#/components/parameters/RuleVersionId'
    get:
      tags: [物种规则]
      operationId: getSpeciesRuleVersion
      summary: 获取规则版本
      description: 返回单个规则版本及来源。
      responses:
        '200':
          description: 规则版本
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesRuleVersionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [物种规则]
      operationId: updateSpeciesRuleVersion
      summary: 更新尚未冻结的规则版本
      description: 已被繁育计划引用的规则版本保持只读，应创建新版本。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/SpeciesRuleVersionUpdateRequest'
      responses:
        '200':
          description: 规则版本已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesRuleVersionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /hamsters:
    get:
      tags: [仓鼠]
      operationId: listHamsters
      summary: 列出仓鼠
      description: 使用 cursor 分页；支持按状态、性别、笼盒和关键词筛选。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: lifecycle_status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/HamsterLifecycleStatus'
        - name: sex
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Sex'
        - name: enclosure_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 编号或昵称关键词
      responses:
        '200':
          description: 仓鼠列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HamsterListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [仓鼠]
      operationId: createHamster
      summary: 创建仓鼠档案
      description: owner_id 从认证上下文解析；父母关系写入 pedigree_parentage。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HamsterCreateRequest'
            example:
              internal_code: SY-2026-001
              name: 小云
              species_rule_version_id: 018f47a2-3e3b-7e40-9665-12cd57082cf0
              variety_code: syrian
              sex: female
              birth_date: '2026-05-20'
              source_type: introduced
              notes: 引入种母
      responses:
        '201':
          description: 仓鼠已创建
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HamsterResponse'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /hamsters/batch:
    post:
      tags: [仓鼠]
      operationId: batchCreateHamsters
      summary: 批量创建仓鼠
      description: 返回整体事务状态与逐项结果；每项使用 client_item_id 对齐客户端记录。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HamsterBatchCreateRequest'
      responses:
        '200':
          description: 批处理已完成，可能全部成功或部分失败
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HamsterBatchCreateResponse'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /hamsters/{hamster_id}:
    parameters:
      - $ref: '#/components/parameters/HamsterId'
    get:
      tags: [仓鼠]
      operationId: getHamster
      summary: 获取仓鼠详情
      description: 返回档案、当前笼位和版本号。
      responses:
        '200':
          description: 仓鼠详情
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HamsterResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [仓鼠]
      operationId: updateHamster
      summary: 更新仓鼠档案
      description: 请求体不接受 owner_id、state 或父母快捷字段；父母变更走家谱关系接口。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/HamsterUpdateRequest'
      responses:
        '200':
          description: 仓鼠已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HamsterResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /hamsters/{hamster_id}/pedigree:
    parameters:
      - $ref: '#/components/parameters/HamsterId'
    get:
      tags: [家谱]
      operationId: getHamsterPedigree
      summary: 获取仓鼠家谱图
      description: 返回 pedigree_parentage 边、窝次父母与窝次成员推导出的统一关系图。
      parameters:
        - name: generations
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 4
      responses:
        '200':
          description: 家谱图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedigreeGraphResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /pedigree-parentages:
    get:
      tags: [家谱]
      operationId: listPedigreeParentages
      summary: 列出家谱父母边
      description: 按子代、父母或有效期筛选 pedigree_parentage。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: child_hamster_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: parent_hamster_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 父母关系列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedigreeParentageListResponse'
        '401':
