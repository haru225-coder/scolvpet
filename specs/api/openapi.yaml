    GeneticSimulationRequest:
      type: object
      description: |
        繁殖推算请求。商家默认使用 phenotype_table 模式，数据来自《金丝熊后代推算整理表（双重核验版）》权威表。
        mendel 模式保留简化位点基因型推算（教育用）。
      properties:
        mode:
          type: string
          enum:
          - phenotype_table
          - mendel
          description: phenotype_table=核心表查表；mendel=简化孟德尔
        series:
          type: string
          description: 系列代码或中文名，如 poly / 波利系列 / chocolate / 巧克力色系
        sire_phenotype:
          type: string
          description: 父本表型（phenotype_table 模式）
        dam_phenotype:
          type: string
          description: 母本表型（phenotype_table 模式）
        sire_hamster_id:
          type: string
          format: uuid
          description: 可选父本档案 ID；父母双方都提供时启用具体亲本历史校准
        dam_hamster_id:
          type: string
          format: uuid
          description: 可选母本档案 ID；父母双方都提供时启用具体亲本历史校准
        target_phenotype:
          type: string
          description: 可选重点表型；客户端可据最终概率计算本窝至少出现一只的机会
        sire:
          type: object
          additionalProperties:
            type: string
          description: 父本基因型位点映射（mendel 模式）
        dam:
          type: object
          additionalProperties:
            type: string
          description: 母本基因型位点映射（mendel 模式）
      additionalProperties: false
    PhenotypeTableOutcome:
      type: object
      properties:
        phenotype:
          type: string
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 最终模拟概率；有历史数据时为权威表强先验校准后的概率
        fraction:
          type: string
          description: 仅静态权威表概率存在精确分数时返回
        note:
          type: string
      required:
      - phenotype
      - probability
      additionalProperties: false
    GeneticOutcome:
      type: object
      properties:
        genotype_key:
          type: string
        genotype:
          type: object
          additionalProperties:
            type: string
        phenotype_label:
          type: string
        phenotype:
          type: object
          additionalProperties:
            type: string
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 1
        count_weight:
          type: integer
          minimum: 1
      required:
      - genotype_key
      - genotype
      - phenotype_label
      - phenotype
      - probability
      - count_weight
      additionalProperties: false
    GeneticSimulationResult:
      type: object
      properties:
        mode:
          type: string
          enum:
          - phenotype_table
          - mendel
        table_id:
          type: string
        table_version:
          type: string
        series:
          type: string
        series_name:
          type: string
        sire_phenotype:
          type: string
        dam_phenotype:
          type: string
        sire:
          type: object
          additionalProperties:
            type: string
        dam:
          type: object
          additionalProperties:
            type: string
        outcomes:
          type: array
          items:
            "$ref": "#/components/schemas/GeneticOutcome"
        table_outcomes:
          type: array
          items:
            "$ref": "#/components/schemas/PhenotypeTableOutcome"
        prediction_basis:
          type: string
          enum:
          - authority_table
          - authority_table_plus_history
          description: 前端仅需映射为“基于权威表”或“已结合历史繁殖记录”
        history_litter_count:
          type: integer
          minimum: 0
        history_pup_count:
          type: integer
          minimum: 0
        notes:
          type: string
      required:
      - sire
      - dam
      - outcomes
      - notes
      additionalProperties: false
