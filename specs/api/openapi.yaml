components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff access token（员工 App 登录后的 JWT 风格 access token）
    customerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Customer opaque bearer（ct_ 前缀，短信验证后颁发，非 JWT）

  parameters:
    P1P2IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: P1/P2 写请求建议使用的幂等键；服务端以 owner、方法、路径和规范化载荷记录审计上下文。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: 可选的当前资源版本 ETag；传入时用于乐观并发控制。
      schema:
        type: string
        pattern: ^W?/"[0-9]+"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        写请求唯一键。唯一域为 owner_id + action_code + resource_id + key；相同规范化
        载荷返回首次结果，不同载荷返回 409 IDEMPOTENCY_PAYLOAD_MISMATCH。结果至少保留
        24 小时；confirm-birth、individualize 与分享撤销保留至对应业务记录归档。
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: 018f47a2-281b-79e2-b861-bf785ab6fba7
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前资源版本对应的 ETag，例如双引号包裹的整数版本。
      schema:
        type: string
        pattern: '^W?/"[0-9]+"$'
      example: '"7"'
    RequestTimezone:
      name: X-Timezone
      in: header
      required: false
      description: IANA 时区；缺省时使用当前熊舍 timezone。
      schema:
        type: string
        minLength: 1
        maxLength: 64
        default: Asia/Shanghai
      example: Asia/Shanghai
    Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页响应返回的不透明 next_cursor。
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: 每页数量。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    RuleVersionId:
      name: rule_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HamsterId:
      name: hamster_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnclosureId:
      name: enclosure_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StayId:
      name: stay_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LitterId:
      name: litter_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HealthRecordId:
      name: health_record_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReminderId:
      name: reminder_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: media_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareId:
      name: share_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 24
        maxLength: 128
    ImportTemplateType:
      name: template_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ImportTemplateType'
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    IdempotencyKey:
      description: 服务端确认使用的幂等键
      schema:
        type: string
      example: 018f47a2-281b-79e2-b861-bf785ab6fba7
    IdempotencyReplayed:
      description: true 表示本次返回首次请求的已保存结果
      schema:
        type: boolean
      example: false
    ETag:
      description: 当前资源 version 的弱或强 ETag
      schema:
        type: string
        pattern: '^W?/"[0-9]+"$'
      example: '"8"'
    Location:
      description: 新建资源或异步作业的相对地址
      schema:
        type: string
      example: /v1/jobs/018f47a2-7862-7129-b21f-e415c86bbf5c

  responses:
    Unauthorized:
      description: 访问令牌缺失、无效或过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: 请重新登录
              field_errors: []
              recovery_actions:
                - action: login
                  label: 使用手机验证码登录
                  method: POST
                  path: /v1/auth/sessions
            meta:
              request_id: req_01J0ERR401
              generated_at: '2026-07-16T03:00:00Z'
              timezone: Asia/Shanghai
    Forbidden:
      description: 当前成员角色缺少执行该操作的权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PERMISSION_DENIED
              message: 当前角色没有执行此操作的权限
              field_errors: []
              recovery_actions: []
            meta:
              request_id: req_01J0ERR403
              generated_at: '2026-07-19T03:00:00Z'
              timezone: Asia/Shanghai
    NotFound:
      description: 资源不存在、已撤销或不属于当前 owner
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: 未找到指定资源
              field_errors: []
              recovery_actions: []
            meta:
              request_id: req_01J0ERR404
              generated_at: '2026-07-16T03:00:00Z'
              timezone: Asia/Shanghai
    ConflictError:
      description: 版本、状态、幂等键或资源占用冲突
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            version_conflict:
              summary: 乐观锁版本冲突
              value:
                error:
                  code: VERSION_CONFLICT
                  message: 资源已被其他操作更新
                  field_errors: []
                  current_version: 8
                  recovery_actions:
                    - action: refresh
                      label: 刷新最新数据
                      method: GET
                      path: /v1/breeding-plans/018f47a2-4e63-7cc4-80b4-94a589917a36
                  details:
                    submitted_version: 7
                meta:
                  request_id: req_01J0ERR409A
                  generated_at: '2026-07-16T03:00:00Z'
                  timezone: Asia/Shanghai
            state_conflict:
              summary: 业务状态冲突
              value:
                error:
                  code: STATE_CONFLICT
                  message: 当前状态不允许执行该动作
                  field_errors: []
                  current_version: 8
                  recovery_actions:
                    - action: inspect_current_state
                      label: 查看当前计划
                      method: GET
                      path: /v1/breeding-plans/018f47a2-4e63-7cc4-80b4-94a589917a36
                  details:
                    current_state: gestation
                    allowed_states:
                      - pair_ready
                meta:
                  request_id: req_01J0ERR409B
                  generated_at: '2026-07-16T03:00:00Z'
                  timezone: Asia/Shanghai
            cage_conflict:
              summary: 笼位占用冲突
              value:
                error:
                  code: CAGE_CONFLICT
                  message: 目标笼盒在指定时段已有占用
                  field_errors:
                    - field: dam_destination_enclosure_id
                      code: occupied
                      message: 目标笼盒已被 SY-2026-009 占用
                  current_version: 4
                  recovery_actions:
                    - action: choose_another_enclosure
                      label: 选择其他笼盒
                      method: GET
                      path: /v1/enclosures?state=vacant
                  details:
                    conflicting_stay_id: 018f47a2-a81a-7017-a1cc-c0532dbc0c1c
                    conflict_from: '2026-07-18T11:00:00Z'
                meta:
                  request_id: req_01J0ERR409C
                  generated_at: '2026-07-16T03:00:00Z'
                  timezone: Asia/Shanghai
    ValidationError:
      description: 字段格式或领域规则校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            field_validation:
              summary: 字段校验错误
              value:
                error:
                  code: VALIDATION_FAILED
                  message: 请求字段校验失败
                  field_errors:
                    - field: initial_alive_count
                      code: minimum
                      message: 初始活仔数必须大于等于 0
                  recovery_actions:
                    - action: edit_request
                      label: 修改后重新提交
                      method: POST
                      path: /v1/breeding-plans/018f47a2-4e63-7cc4-80b4-94a589917a36/confirm-birth
                meta:
                  request_id: req_01J0ERR422A
                  generated_at: '2026-07-16T03:00:00Z'
                  timezone: Asia/Shanghai
            business_rule:
              summary: 领域完整性错误
              value:
                error:
                  code: LITTER_COUNT_MISMATCH
                  message: 窝仔数量未闭合
                  field_errors: []
                  current_version: 5
                  recovery_actions:
                    - action: inspect_reconciliation
                      label: 查看数量对账
                      method: GET
                      path: /v1/litters/018f47a2-72b3-76d8-b31f-5848c42bb577
                    - action: adjust_count
                      label: 补录数量流水
                      method: POST
                      path: /v1/litters/018f47a2-72b3-76d8-b31f-5848c42bb577/count-events
                  details:
                    expected_managed_count: 5
                    represented_count: 4
                    difference: 1
                meta:
                  request_id: req_01J0ERR422B
                  generated_at: '2026-07-16T03:00:00Z'
                  timezone: Asia/Shanghai
    RateLimited:
      description: 请求频率过高
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
            minimum: 1
          example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: 请求过于频繁，请稍后重试
              field_errors: []
              recovery_actions:
                - action: retry_later
                  label: 60 秒后重试
                  method: POST
                  path: /v1/auth/verification-codes
              details:
                retry_after_seconds: 60
            meta:
              request_id: req_01J0ERR429
              generated_at: '2026-07-16T03:00:00Z'
              timezone: Asia/Shanghai

  schemas:
    ResponseMeta:
