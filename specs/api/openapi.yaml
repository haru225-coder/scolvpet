          type: string
        mappings:
          type: array
          minItems: 1
          items:
            type: object
            required: [source_column, target_field, empty_value_policy]
            properties:
              source_column:
                type: string
              target_field:
                type: string
              empty_value_policy:
                type: string
                enum: [keep_null, use_default, reject_row]
              default_value:
                type: [string, number, integer, boolean, 'null']
              format_hint:
                type: [string, 'null']
            additionalProperties: false
      additionalProperties: false

    ImportPreflightRequest:
      type: object
      required:
        - strict_references
        - historical_litter_policy
        - parentage_conflict_policy
        - existing_field_policy
      properties:
        strict_references:
          type: boolean
          const: true
          description: 父母、窝次和笼位引用缺失时必须报错
        duplicate_policy:
          type: string
          enum: [reject, skip, update_with_version]
          default: reject
        historical_litter_policy:
          type: string
          enum: [create_if_complete, require_existing]
          description: |
            create_if_complete 仅在同一历史窝次编号的出生时间、双亲和物种规则一致时，
            自动规划创建一个历史窝次；信息缺失或冲突时产生阻塞问题。
        parentage_conflict_policy:
          type: string
          const: reject
          description: 导入父母与既有已接受谱系边或同窝父母不一致时拒绝相关行
        existing_field_policy:
          type: string
          enum: [preserve_non_null, reject_updates]
          description: 默认不覆盖已有非空字段；更新候选必须在提交时逐项确认并带版本
      additionalProperties: false

