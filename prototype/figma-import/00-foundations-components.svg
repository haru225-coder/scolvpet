132" y="1900" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" fill="#5F7773" text-anchor="start" >3. confirm-birth 与 individualize 使用全页面，展示事务和数量结果。</text><text x="132" y="1938" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" fill="#5F7773" text-anchor="start" >4. 离线仅查看缓存/保存草稿；状态迁移、导入、分享、备份必须在线。</text><text x="132" y="1976" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" fill="#5F7773" text-anchor="start" >5. WEB-01 由服务端 SSR + Web 交付，匿名访问仅读取有效 share token。</text><text x="132" y="2014" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" fill="#5F7773" text-anchor="start" >6. 导出、备份、用量在 P25 显性展示，并可从 P27 查看任务。</text><text x="1180" y="1940" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="26" font-weight="700" fill="#1F2928" text-anchor="start" >验收标记</text><rect x="1180" y="1990" width="520" height="74" rx="14" fill="#FFFFFF" stroke="#C8CECB" /><circle cx="1210" cy="2018" r="7" fill="#4F7F68"/><text x="1232" y="2018" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F2928" text-anchor="start" >文字无裁切</text><text x="1232" y="2042" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="11" font-weight="400" fill="#6C7774" text-anchor="start" >390 × 844 移动端画框</text><text x="1672" y="2030" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#4F7F68" text-anchor="middle" >✓</text><rect x="1180" y="2080" width="520" height="74" rx="14" fill="#FFFFFF" stroke="#C8CECB" /><circle cx="1210" cy="2108" r="7" fill="#4F7F68"/><text x="1232" y="2108" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14